[package]
name = "ferrosa"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", features = ["statically-linked-dxc"] }
winit = "0.30.13"
ab_glyph = "0.2.32"
bevy_enhanced_input = "0.27"
steamworks = { version = "0.13.1", features = ["raw-bindings"] }
rand = "0.10"
cpal = "0.18.2"
rodio = { version = "0.23.0", features = ["wav"] }
rusty-opus = "1.0.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
ferrosa-protocol = { path = "../new_server/crates/ferrosa-protocol" }
ferrosa-map = { path = "../new_server/crates/ferrosa-map" }
ferrosa-world = { path = "../new_server/crates/ferrosa-world" }
binrw = "0.15.0"
discord-sdk = "0.4.0"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
futures-lite = "2.6.1"
serde_json = "1.0.154"

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
