[package]
name = "new_client"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20"
ab_glyph = "0.2.32"
bevy_enhanced_input = "0.27"
steamworks = { version = "0.13.1", features = ["raw-bindings"] }
rand = "0.10"
cpal = "0.17.3"
rodio = { version = "0.22", features = ["wav"] }
rusty-opus = "1.0.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt", "time"] }
ferrosa-protocol = { path = "../new_server/crates/ferrosa-protocol" }
ferrosa-map = { path = "../new_server/crates/ferrosa-map" }
ferrosa-world = { path = "../new_server/crates/ferrosa-world" }
binrw = "0.15.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
