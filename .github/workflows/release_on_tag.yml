name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: new_client
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: ferrosa-windows-x64
            bin: ferrosa.exe
            steam: win64/steam_api64.dll
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: ferrosa-linux-x64
            bin: ferrosa
            steam: linux64/libsteam_api.so
            rustflags: -C link-arg=-Wl,-rpath,$ORIGIN
          - os: macos-latest
            target: aarch64-apple-darwin
            name: ferrosa-macos-arm64
            bin: ferrosa
            steam: osx/libsteam_api.dylib
            rustflags: -C link-arg=-Wl,-rpath,@executable_path
    steps:
      - uses: actions/checkout@v4
        with:
          path: new_client
          submodules: true
          lfs: true
          token: ${{ secrets.SERVER_REPO_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ferrosa-game/Dedicated-Server
          path: new_server
          token: ${{ secrets.SERVER_REPO_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          staging="${{ matrix.name }}"
          release="target/${{ matrix.target }}/release"
          steam=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -path "*steamworks-sys-0.13.*/lib/steam/redistributable_bin/${{ matrix.steam }}" | sort | tail -n 1)

          if [ -z "$steam" ]; then
            echo "no Steam library found for ${{ matrix.steam }}"
            exit 1
          fi

          mkdir "$staging"
          cp "$release/${{ matrix.bin }}" "$staging/"
          cp "$steam" "$staging/"
          cp -r data "$staging/"
          find "$staging/data" -mindepth 1 -name '.*' -exec rm -rf {} +

          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd "$staging" && 7z a "../$staging.zip" .)
          else
            (cd "$staging" && zip -r "../$staging.zip" .)
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: new_client/${{ matrix.name }}.zip
